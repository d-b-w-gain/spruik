name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: sh -n scripts/*.sh
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose config
      - name: Build Spruik image
        run: docker build -t spruik:test .
