apiVersion: apps/v1
kind: Deployment
metadata:
  name: spruik
  namespace: telephony
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: spruik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spruik
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: asterisk
          image: ghcr.io/example/spruik:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: spruik-settings
            - secretRef:
                name: spruik-secrets
          ports:
            - name: sip
              containerPort: 5060
              protocol: UDP
          readinessProbe:
            exec:
              command: ["/usr/sbin/asterisk", "-rx", "core show uptime"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/usr/sbin/asterisk", "-rx", "core show uptime"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 999
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sounds
              mountPath: /var/lib/asterisk/sounds/custom
            - name: run
              mountPath: /var/run/asterisk
      volumes:
        - name: sounds
          emptyDir: {}
        - name: run
          emptyDir: {}
