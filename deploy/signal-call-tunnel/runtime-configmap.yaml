apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-call-bridge-runtime
  namespace: cnc-controller
data:
  inbound-calls-enabled: "false"
  inbound-greeting: Spruik is online. Signal voice is connected. The inbound call path is working.
  inbound-voice: af_heart
  kokoro-url: http://kokoro-tts.tts.svc.cluster.local:8880/v1/audio/speech
  signal-audiosocket-bridge.conf: |
    [program:signal-audiosocket-bridge]
    command=/usr/local/bin/start-signal-audiosocket-bridge
    autostart=true
    autorestart=true
    startretries=60
    startsecs=2
    priority=1000
    user=signal-api
    redirect_stderr=true
    stdout_logfile=/var/log/signal-audiosocket-bridge.log
    stdout_logfile_maxbytes=10MB
    stdout_logfile_backups=2
    environment=PULSE_SERVER="unix:/run/spruik-pulse/native"
