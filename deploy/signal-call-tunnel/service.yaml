apiVersion: v1
kind: Service
metadata:
  name: signal-call-bridge
  namespace: cnc-controller
spec:
  type: ClusterIP
  selector:
    app: signal-cli
  ports:
    - name: control
      port: 9091
      targetPort: 9091
      protocol: TCP
    - name: audiosocket
      port: 9092
      targetPort: 9092
      protocol: TCP
