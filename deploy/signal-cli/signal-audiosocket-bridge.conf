[program:signal-audiosocket-bridge]
command=/usr/bin/python3 /usr/local/bin/signal-audiosocket-bridge.py
autostart=true
autorestart=true
startretries=60
startsecs=2
priority=1000
user=signal-api
redirect_stderr=true
stdout_logfile=/var/log/signal-audiosocket-bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
environment=PULSE_SERVER="unix:/run/spruik-pulse/native",SIGNAL_CALL_ACCOUNT="%(ENV_SIGNAL_CALL_ACCOUNT)s",SIGNAL_CALL_RECIPIENT="%(ENV_SIGNAL_CALL_RECIPIENT)s"
