[program:signal-audiosocket-bridge]
command=/bin/sh -c 'export SIGNAL_CALL_ACCOUNT="$(cat /run/secrets/signal-call-bridge/account)"; export SIGNAL_CALL_RECIPIENT="$(cat /run/secrets/signal-call-bridge/recipient)"; exec /usr/bin/python3 /usr/local/bin/signal-audiosocket-bridge.py'
autostart=true
autorestart=true
startretries=60
startsecs=2
priority=1000
user=signal-api
redirect_stderr=true
stdout_logfile=/var/log/signal-audiosocket-bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
environment=PULSE_SERVER="unix:/run/spruik-pulse/native",SIGNAL_INBOUND_CALLS_ENABLED="%(ENV_SIGNAL_INBOUND_CALLS_ENABLED)s",SIGNAL_INBOUND_GREETING="%(ENV_SIGNAL_INBOUND_GREETING)s",SIGNAL_INBOUND_VOICE="%(ENV_SIGNAL_INBOUND_VOICE)s",KOKORO_URL="%(ENV_KOKORO_URL)s"
